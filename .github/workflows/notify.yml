# Study reminders, one pass by hand (server/cmd/notify, docs/design/notifications.md). The API sends reminders itself
# every two minutes (NOTIFY_WORKER=1 on Render, D91); GitHub's schedule skipped most runs, so it is no longer used.
# This button is for a pass while the API is down, or to try a change: Actions, Study reminders, Run workflow.
# Running it beside the API never sends twice (the queue's locks and keys).
name: Study reminders

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go run ./cmd/notify -for 5m
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
          NOTIFY_TOKEN_SECRET: ${{ secrets.NOTIFY_TOKEN_SECRET }}
          NOTIFY_VAPID_PUBLIC: ${{ vars.NOTIFY_VAPID_PUBLIC }}
          NOTIFY_VAPID_PRIVATE: ${{ secrets.NOTIFY_VAPID_PRIVATE }}
          NOTIFY_SMTP_USER: 99ile.team@gmail.com
          NOTIFY_SMTP_PASSWORD: ${{ secrets.DIGEST_SMTP_PASSWORD }}
          NOTIFY_DRY: ${{ vars.NOTIFY_DRY }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}
          NOTIFY_PUSH: ${{ vars.NOTIFY_PUSH }}
