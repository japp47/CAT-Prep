# Sends new problem reports once a day, then marks them seen (server/internal/digest, docs/feature.md F39):
# an email with the students' notes to the team's Gmail, and a comment without notes on the public issue
# "Problem reports from students". The email needs the DIGEST_SMTP_PASSWORD secret (a Gmail app password for
# DIGEST_SMTP_USER); without it, only the issue is posted.
name: Problem report digest

on:
  schedule:
    - cron: "30 3 * * *" # 09:00 in India
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go run ./cmd/digest
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DIGEST_SMTP_USER: 99ile.team@gmail.com
          DIGEST_SMTP_PASSWORD: ${{ secrets.DIGEST_SMTP_PASSWORD }}
