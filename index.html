<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="99ile: free CAT preparation with a personal timetable that adapts to the time you have, curated VARC resources, past papers, mocks, topper stories, exam updates and guidance." />
    <meta name="theme-color" content="#eef0f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12161e" media="(prefers-color-scheme: dark)" />
    <!-- Search results ask for a square PNG or ICO at a multiple of 48px, and any browser asks for /favicon.ico first;
         the SVG is for tabs, which scale it. All three show the same mark. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="99ile" />
    <title>99ile: free CAT prep</title>
    <!-- How a link looks when it is shared (Instagram, WhatsApp, X): the site's own, whichever page was shared. No og:url,
         so each shared page keeps its own address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="99ile" />
    <meta property="og:title" content="99ile: free CAT prep" />
    <meta property="og:description" content="A free CAT coach: a plan that fits your day, original practice, and a reason for every option. No sign-up." />
    <meta property="og:image" content="https://99ile.in/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="99ile: prepare for CAT, one day at a time. A hill of dots showing where a score falls among all CAT takers." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Tells a search engine that 99ile is the name of this site and its owner, not a misspelling of "99th percentile", and that
         people who type it with a space or a hyphen mean the same site (src/lib/seo.test.ts checks these names). -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@graph":[
        {"@type":"WebSite","@id":"https://99ile.in/#website","url":"https://99ile.in/","name":"99ile","alternateName":["99ile CAT prep","99 ile","99-ile","99ile.in"],"description":"Free CAT preparation with a plan that fits your day, original practice and a reason for every option.","inLanguage":"en-IN","publisher":{"@id":"https://99ile.in/#org"}},
        {"@type":"Organization","@id":"https://99ile.in/#org","name":"99ile","alternateName":["99 ile","99-ile"],"url":"https://99ile.in/","logo":"https://99ile.in/icon-512.png","email":"99ile.team@gmail.com","sameAs":["https://www.instagram.com/the99ile/"]}
      ]}
    </script>
    <!-- The first paint (F97, D115): before any script, the stored theme and the page's shape (Home without the sidebar,
         the panel without a frame, every other page with it), so the frame in #root below matches the page that replaces
         it. The security policy allows this one inline script by its sha256 hash (public/_headers; a test checks it). -->
    <script>(function(){try{var d=document.documentElement,g=function(k,v){var x=localStorage.getItem("cat-prep-pref:"+k);return x===null?v:JSON.parse(x)},t=g("theme","auto"),p=location.pathname;if(t==="light"||t==="dark")d.setAttribute("data-theme",t);d.className+=p==="/"?" fp-home":p.indexOf("/panel")===0?" fp-none":" fp-app"+(g("sidebar-collapsed",false)?" fp-narrow":"")}catch(e){}})();</script>
    <style>
      /* The frame shown until the app renders: the bars where Layout.tsx puts them, in the site's own colours. */
      .fp{min-height:100dvh}
      .fp-top{position:sticky;top:0;display:flex;align-items:center;gap:10px;height:56px;padding:0 max(1rem,env(safe-area-inset-left));background:var(--sidebar)}
      .fp-top img,.fp-side img{width:36px;height:36px;flex:none}
      .fp-top span,.fp-side span{font:700 1.375rem/1 "Schibsted Grotesk",system-ui,sans-serif;letter-spacing:-.025em;color:var(--foreground)}
      .fp-side{display:none}
      .fp-bottom{display:none;position:fixed;inset:auto 0 0 0;height:calc(4rem + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--border)}
      .fp-app .fp-bottom{display:block}
      .fp-none .fp{display:none}
      @media (min-width:40rem){.fp-top{padding:0 max(1.5rem,env(safe-area-inset-left))}}
      @media (min-width:60rem){.fp-top{padding:0 max(3rem,env(safe-area-inset-left))}}
      @media (min-width:64rem){
        .fp-home .fp-top{height:4.5rem;background:var(--background);max-width:1440px;margin:0 auto}
        .fp-app .fp-top,.fp-app .fp-bottom{display:none}
        .fp-app .fp-side{display:block;position:fixed;top:0;bottom:0;left:0;width:288px;padding:26px 24px;background:var(--sidebar)}
        .fp-brand{display:flex;align-items:center;gap:10px}
        .fp-narrow .fp-side{width:72px;padding:26px 18px}
        .fp-narrow .fp-side span{display:none}
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="fp" aria-hidden="true"><div class="fp-top"><img src="/favicon.svg" alt="" /><span>99ile</span></div><div class="fp-side"><div class="fp-brand"><img src="/favicon.svg" alt="" /><span>99ile</span></div></div><div class="fp-bottom"></div></div></div>
    <!-- For a reader that does not run scripts: a crawler that does not render, a text browser, a blocked script. With
         scripts on it is never shown, so it costs the first paint nothing. -->
    <noscript>
      <div style="max-width:40rem;margin:2rem auto;padding:0 1rem;font:16px/1.6 system-ui,sans-serif">
        <h1>99ile: free CAT preparation</h1>
        <p>A free CAT coach: a plan that fits your day, original practice, and a reason for every option. No sign-up; your progress stays on this device.</p>
        <p>99ile needs JavaScript to run. Turn it on and reload to open your plan.</p>
        <ul>
          <li><a href="/varc">VARC: verbal ability and reading comprehension</a></li>
          <li><a href="/dilr">DILR: data interpretation and logical reasoning</a></li>
          <li><a href="/practice">Practice</a></li>
          <li><a href="/guides">Guides</a></li>
          <li><a href="/exams">CAT and other exams</a></li>
          <li><a href="/privacy">Privacy</a></li>
          <li><a href="/contact">Contact us</a></li>
        </ul>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
